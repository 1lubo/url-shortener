{% extends "base.html" %}

{% block content %}
<div class="bg-slate-800 rounded-xl p-8 shadow-2xl border border-slate-700">
    <form hx-post="/shorten" hx-target="#result" hx-swap="innerHTML" class="space-y-4">
        <div>
            <label for="url" class="block text-sm font-medium text-slate-300 mb-2">
                Enter your long URL
            </label>
            <input 
                type="url" 
                name="url" 
                id="url" 
                required
                placeholder="https://example.com/very/long/url/that/needs/shortening"
                class="w-full px-4 py-3 bg-slate-900 border border-slate-600 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all text-white placeholder-slate-500"
            >
        </div>
        
        <div>
            <label for="custom_alias" class="block text-sm font-medium text-slate-300 mb-2">
                Custom alias <span class="text-slate-500">(optional)</span>
            </label>
            <input 
                type="text" 
                name="custom_alias" 
                id="custom_alias"
                pattern="[a-zA-Z0-9_-]+"
                placeholder="my-custom-link"
                class="w-full px-4 py-3 bg-slate-900 border border-slate-600 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all text-white placeholder-slate-500"
            >
        </div>
        
        <button 
            type="submit"
            class="w-full py-3 px-6 bg-blue-600 hover:bg-blue-700 rounded-lg font-semibold transition-colors flex items-center justify-center gap-2"
        >
            <span>Shorten URL</span>
            <span class="htmx-indicator">
                <svg class="animate-spin h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
            </span>
        </button>
    </form>
</div>

<div id="result" class="mt-6"></div>
{% endblock %}
