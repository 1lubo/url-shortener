<div class="bg-slate-800 rounded-xl p-6 border border-slate-700">
    {% if error %}
    <div class="flex items-center gap-3 text-red-400">
        <svg class="w-6 h-6 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
        </svg>
        <span>{{ error }}</span>
    </div>
    {% else %}
    <div class="space-y-4">
        <div class="flex items-center gap-2 text-green-400 mb-4">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
            </svg>
            <span class="font-medium">URL shortened successfully!</span>
        </div>

        <div>
            <label class="block text-sm text-slate-400 mb-1">Your short URL</label>
            <div class="flex gap-2">
                <input
                    type="text"
                    id="short-url"
                    value="{{ short_url }}"
                    readonly
                    class="flex-1 px-4 py-3 bg-slate-900 border border-slate-600 rounded-lg text-blue-400 font-mono"
                >
                <button
                    onclick="copyToClipboard()"
                    class="px-4 py-3 bg-slate-700 hover:bg-slate-600 rounded-lg transition-colors flex items-center gap-2"
                >
                    <svg id="copy-icon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
                    </svg>
                    <span id="copy-text">Copy</span>
                </button>
            </div>
        </div>

        <div class="text-sm text-slate-400">
            <span class="text-slate-500">Original:</span>
            <a href="{{ original_url }}" target="_blank" class="text-slate-300 hover:text-white break-all">
                {{ original_url | truncate(60) }}
            </a>
        </div>

        <!-- QR Code Section -->
        <div class="pt-4 border-t border-slate-700">
            <div class="flex items-center justify-between mb-3">
                <label class="block text-sm text-slate-400">QR Code</label>
                <a
                    href="{{ qr_url }}"
                    download="{{ short_code }}-qr.png"
                    class="text-sm text-blue-400 hover:text-blue-300 flex items-center gap-1"
                >
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
                    </svg>
                    Download
                </a>
            </div>
            <div class="flex justify-center bg-white rounded-lg p-4">
                <img
                    src="{{ qr_url }}"
                    alt="QR Code for {{ short_url }}"
                    class="w-32 h-32"
                >
            </div>
        </div>
    </div>

    <script>
        function copyToClipboard() {
            const url = document.getElementById('short-url').value;
            navigator.clipboard.writeText(url).then(() => {
                document.getElementById('copy-text').textContent = 'Copied!';
                document.getElementById('copy-icon').innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>';
                setTimeout(() => {
                    document.getElementById('copy-text').textContent = 'Copy';
                    document.getElementById('copy-icon').innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path>';
                }, 2000);
            });
        }
    </script>
    {% endif %}
</div>
